spring.application.name=pc-mania.app
security.cognito.cliente.issuer=${COGNITO_CLIENT_ISSUER}
security.cognito.cliente.client-id=${COGNITO_CLIENT_ID}
security.cognito.admin.issuer=${COGNITO_ADMIN_ISSUER}
security.cognito.admin.client-id=${COGNITO_ADMIN_CLIENT_ID}
pc-mania.messaging.url=${MESSAGING_SERVICE_URL:http://localhost:8081}
pc-mania.messaging.events-enabled=${MESSAGING_EVENTS_ENABLED:false}
pc-mania.kinesis.url=${KINESIS_SERVICE_URL:http://localhost:8081}
pc-mania.kinesis.events-enabled=${KINESIS_EVENTS_ENABLED:false}
pc-mania.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
